version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geoventra-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geoventra}
      POSTGRES_USER: ${POSTGRES_USER:-geoventra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geoventra}
    ports:
      - "5432:5432"
    volumes:
      - geoventra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geoventra} -d ${POSTGRES_DB:-geoventra}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: node:20-alpine
    container_name: geoventra-api
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@10.20.0 --activate && pnpm install --frozen-lockfile=false && pnpm --filter @geoventra/api build && pnpm --filter @geoventra/api start"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-geoventra}:${POSTGRES_PASSWORD:-geoventra}@postgres:5432/${POSTGRES_DB:-geoventra}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
    ports:
      - "4000:4000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    container_name: geoventra-web
    working_dir: /app
    command: sh -c "corepack enable && corepack prepare pnpm@10.20.0 --activate && pnpm install --frozen-lockfile=false && pnpm --filter @geoventra/web build && pnpm --filter @geoventra/web start"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    depends_on:
      - api

volumes:
  geoventra_pgdata:
